services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      BASE_URL: https://${FABRUN_DOMAIN}
      WEB_ORIGIN: https://${FABRUN_DOMAIN}
      FrontendOrigin: https://${FABRUN_DOMAIN}
      AllowedHosts: ${FABRUN_DOMAIN}
      ReverseProxy__KnownProxy: 172.30.0.2
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      FABRUN_ACCESS_PASSWORD: ${FABRUN_ACCESS_PASSWORD}
      FABRUN_SESSION_VERSION: ${FABRUN_SESSION_VERSION}
    volumes:
      - fabrun-data:/app/Data
      - fabrun-keys:/home/app/.aspnet/DataProtection-Keys
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    networks:
      fabrun:
        ipv4_address: 172.30.0.3

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    depends_on:
      - api
    environment:
      FABRUN_DOMAIN: ${FABRUN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    networks:
      fabrun:
        ipv4_address: 172.30.0.2

networks:
  fabrun:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  fabrun-data:
  fabrun-keys:
  caddy-data:
  caddy-config:
